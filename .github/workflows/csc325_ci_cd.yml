name: CSC 325 CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

  dependencies:
    name: Dependencies
    needs: setup
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

  test:
    name: Test
    needs: dependencies
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install packages for isolated test job
        run: python -m pip install -r requirements.txt
      - name: Run full Django test suite
        run: python manage.py test --verbosity 2

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Tutorial echo deployment
        run: echo "Deploying the application..."
